<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Editar Patrimônio - TI</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#f8fafc",
            "surface-container": "#f1f5f9",
            "surface-container-high": "#e2e8f0",
            "surface-container-highest": "#cbd5e1",
            "surface-container-lowest": "#ffffff",
            "primary": "#0f172a",
            "on-primary": "#ffffff",
            "primary-container": "#1e293b",
            "on-primary-container": "#e2e8f0",
            "secondary": "#475569",
            "secondary-container": "#e0f2fe",
            "on-secondary-container": "#0369a1",
            "outline": "#94a3b8",
            "outline-variant": "#cbd5e1",
            "error": "#ef4444",
            "on-error": "#ffffff",
            "on-surface": "#0f172a",
            "on-surface-variant": "#475569"
          },
          fontFamily: {
            "body": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-6">
  
  <div class="max-w-xl w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-8 shadow-sm flex flex-col gap-6">
    <div class="flex items-center justify-between border-b border-outline-variant pb-4">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[24px]">edit_square</span>
        <h1 class="font-bold text-primary text-lg">Editar Equipamento: PAT-{{ equipamento.tombo }}</h1>
      </div>
    </div>
    
    <form method="POST" class="flex flex-col gap-4">
      {% csrf_token %}
      
      <!-- Tombo -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider" for="input-tombo">Tombo</label>
        <div class="flex items-center bg-surface-container border border-outline-variant rounded-lg overflow-hidden">
          <span class="text-sm font-medium text-on-surface-variant px-3 bg-surface-container-high py-2.5 border-r border-outline-variant">PAT-</span>
          <input class="w-full bg-transparent px-3 py-2.5 text-sm text-on-surface focus:outline-none" id="input-tombo" name="tombo" maxlength="6" value="{{ equipamento.tombo }}" type="text" required>
        </div>
      </div>

      <!-- Nome da Máquina -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider" for="input-nome-maquina">Nome da Máquina</label>
        <input class="w-full bg-surface-container border border-outline-variant rounded-lg px-3.5 py-2.5 text-sm text-on-surface focus:outline-none" id="input-nome-maquina" name="nome_maquina" value="{{ equipamento.nome_maquina }}" type="text" required>
      </div>

      <!-- IP Alocado -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider" for="input-ip">IP Alocado</label>
        <div class="flex items-center bg-surface-container border border-outline-variant rounded-lg overflow-hidden">
          <span class="text-sm font-medium text-on-surface-variant px-3 bg-surface-container-high py-2.5 border-r border-outline-variant">192.168.1.</span>
          <input class="w-full bg-transparent px-3 py-2.5 text-sm text-on-surface focus:outline-none" id="input-ip" name="ip_alocado" max="254" min="1" value="{{ equipamento.ip_alocado }}" type="number" required>
        </div>
      </div>

      <!-- Setor -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider" for="select-setor">Setor</label>
        <select class="w-full bg-surface-container border border-outline-variant rounded-lg px-3.5 py-2.5 text-sm text-on-surface focus:outline-none cursor-pointer" id="select-setor" name="setor" required>
          <option value="Produção" {% if equipamento.setor == "Produção" %}selected{% endif %}>Produção</option>
          <option value="Financeiro" {% if equipamento.setor == "Financeiro" %}selected{% endif %}>Financeiro</option>
          <option value="Engenharia" {% if equipamento.setor == "Engenharia" %}selected{% endif %}>Engenharia</option>
          <option value="TI / Suporte" {% if equipamento.setor == "TI / Suporte" %}selected{% endif %}>TI / Suporte</option>
          <option value="Recursos Humanos" {% if equipamento.setor == "Recursos Humanos" %}selected{% endif %}>Recursos Humanos</option>
          <option value="Diretoria" {% if equipamento.setor == "Diretoria" %}selected{% endif %}>Diretoria</option>
        </select>
      </div>

      <!-- Botões de Ação -->
      <div class="flex items-center gap-3 pt-2">
        <button class="flex-1 bg-primary text-on-primary hover:bg-primary/90 py-2.5 rounded-lg text-sm font-medium shadow-sm transition-all cursor-pointer" type="submit">
          Salvar Alterações
        </button>
        <a href="{% url 'painel_ti' %}" class="px-4 py-2.5 rounded-lg text-sm font-medium bg-surface-container hover:bg-surface-container-high text-on-surface border border-outline-variant transition-colors text-center">
          Cancelar
        </a>
      </div>
    </form>
  </div>

</body>
</html>
