<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login TI | INFO TI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e9e9e9;
            color: #000000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-size: 16px; /* Tamanho base de fonte aumentado */
        }

        /* Menu Superior / Navbar Wireframe */
        .navbar {
            background-color: #222222;
            color: #ffffff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
        }

        .navbar .logo {
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .navbar ul {
            display: flex;
            list-style: none;
            gap: 10px;
        }

        .navbar a {
            color: #cccccc;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding: 8px 14px;
            border: 1px solid transparent;
            border-radius: 4px;
        }

        .navbar a:hover,
        .navbar a.active {
            color: #ffffff;
            background-color: #444444;
            border: 1px solid #666666;
        }

        .navbar .user-info {
            font-size: 14px;
            color: #ccc;
        }

        .navbar .user-info span {
            color: #fff;
            font-weight: bold;
        }

        /* Container Principal */
        .wireframe-container {
            width: 100%;
            max-width: 550px; /* Largura levemente expandida para acomodar melhor os elementos */
            margin: 35px auto;
            padding: 0 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
        }

        /* Título Principal acima dos cartões */
        .titulo-pagina {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #000;
            margin-bottom: 5px;
        }

        /* Barra de Voltar */
        .card-topo {
            border: 2px dashed #333;
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-voltar {
            text-decoration: none;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            background-color: #e0e0e0;
            padding: 8px 14px;
            border: 1px solid #999;
            box-shadow: 1px 1px 0px #000;
        }

        .btn-voltar:hover {
            background-color: #d0d0d0;
        }

        .btn-voltar:active {
            box-shadow: none;
            transform: translate(1px, 1px);
        }

        .badge-protegido {
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #333;
            padding: 5px 10px;
            background-color: #fff;
        }

        /* Cartão Principal do Login */
        .card-login {
            border: 2px dashed #333;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .card-login-header {
            background-color: #f0f0f0;
            padding: 15px 25px;
            border-bottom: 2px dashed #333;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Formulário */
        form {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            padding: 12px;
            border: 1px solid #999;
            background-color: #e8f0fe;
            font-size: 15px;
            width: 100%;
        }

        .helper-text {
            font-size: 13px;
            color: #666;
        }

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #0000ee;
            text-decoration: underline;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        /* Botão de Submissão */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #999;
            background-color: #e0e0e0;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 1px 1px 0px #000;
        }

        button[type="submit"]:hover {
            background-color: #d0d0d0;
        }

        button[type="submit"]:active {
            box-shadow: none;
            transform: translate(1px, 1px);
        }

        /* Rodapé Fixo */
        .footer {
            background-color: #222222;
            color: #ffffff;
            border-top: 2px solid #000;
            padding: 16px;
            text-align: center;
            font-size: 14px;
            margin-top: auto;
        }

        .footer a {
            color: #8899ff;
            text-decoration: underline;
        }
    </style>
</head>

<body id="topo">

    <!-- Menu Superior Padrão -->
    <nav class="navbar">
        <div class="logo">⚙️ INFO TI</div>
        <ul>
            <li><a href="{% url 'index' %}">Início</a></li>
            <li><a href="{% url 'ramais' %}">Ramais</a></li>
            <li><a href="{% url 'login_ti' %}" class="active">Painel de TI</a></li>
        </ul>
        <div class="user-info">
            Status: <span>Online</span>
        </div>
    </nav>

    <!-- Content Container -->
    <main class="wireframe-container">

        <!-- Título Posicionado no local solicitado -->
        <h1 class="titulo-pagina">INFO TI - Gestão Integrada</h1>

        <!-- Top Bar com Botão Voltar -->
        <div class="card-topo">
            <a class="btn-voltar" href="{% url 'index' %}">
                ← Voltar ao Início
            </a>
            <span class="badge-protegido">
                Acesso Protegido
            </span>
        </div>

        <!-- Login Card -->
        <div class="card-login">
            <div class="card-login-header">
                AUTENTICAÇÃO ÁREA RESTRITA TI
            </div>

            <!-- Formulário do Django -->
            <form method="POST" action="">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">
                        Usuário:
                    </label>
                    <input id="username" name="username" placeholder="ex: joao.silva" required type="text">
                    <span class="helper-text">Formato: (Ex: joao.silva)</span>
                </div>

                <div class="form-group">
                    <div class="password-header">
                        <label for="password">
                            Senha:
                        </label>
                        <button class="toggle-btn" id="togglePass" onclick="
                            const p = document.getElementById('password');
                            const isPass = p.type === 'password';
                            p.type = isPass ? 'text' : 'password';
                            this.innerText = isPass ? 'Ocultar' : 'Mostrar';
                        " type="button">
                            Mostrar
                        </button>
                    </div>
                    <input id="password" name="password" placeholder="••••••••" required type="password">
                </div>

                <div class="checkbox-group">
                    <input id="rememberDevice" type="checkbox">
                    <label for="rememberDevice" style="font-weight: normal; cursor: pointer;">
                        Lembrar credencial neste terminal da fábrica
                    </label>
                </div>

                <div>
                    <button type="submit">
                        ENTRAR NO PAINEL TI
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Rodapé Padrão -->
    <footer class="footer">
        INFO TI © 2026 - Sistema Interno de Suporte e Consulta | <a href="#topo">Voltar ao topo</a>
    </footer>

</body>

</html>
