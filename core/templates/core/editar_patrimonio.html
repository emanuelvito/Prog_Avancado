<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Editar Patrimônio - TI | INFO TI</title>
  <style>
    /* Estilos de Baixa Resolução / Wireframe Minimalista */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #e9e9e9;
      color: #000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-size: 16px;
    }

    .navbar {
      background-color: #222222;
      color: #ffffff;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000;
    }

    .navbar .logo {
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .navbar ul {
      display: flex;
      list-style: none;
      gap: 10px;
    }

    .navbar a {
      color: #cccccc;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 4px;
    }

    .navbar a:hover,
    .navbar a.active {
      color: #ffffff;
      background-color: #444444;
      border: 1px solid #666666;
    }

    .navbar .user-info {
      font-size: 14px;
      color: #ccc;
    }

    .navbar .user-info span {
      color: #fff;
      font-weight: bold;
    }

    .wireframe-container {
      width: 100%;
      max-width: 700px;
      margin: 35px auto;
      padding: 0 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-header {
      border: 2px dashed #333;
      background-color: #ffffff;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-bloco {
      border: 2px dashed #333;
      background-color: #ffffff;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      border-bottom: 1px dashed #999;
      padding-bottom: 10px;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    input {
      padding: 12px;
      border: 1px solid #999;
      background-color: #fafafa;
      font-size: 15px;
      width: 100%;
    }

    .input-group {
      display: flex;
      align-items: center;
    }

    .input-prefix {
      background-color: #e0e0e0;
      border: 1px solid #999;
      border-right: none;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    button,
    .btn {
      padding: 12px 18px;
      border: 1px solid #999;
      background-color: #e0e0e0;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      color: #000;
      display: inline-block;
      box-shadow: 1px 1px 0px #000;
    }

    button:hover,
    .btn:hover {
      background-color: #d0d0d0;
    }

    button:active,
    .btn:active {
      box-shadow: none;
      transform: translate(1px, 1px);
    }

    .alert-error {
      background-color: #f5d0d0;
      border: 2px solid #cc0000;
      color: #990000;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .footer {
      background-color: #222222;
      color: #ffffff;
      border-top: 2px solid #000;
      padding: 16px;
      text-align: center;
      font-size: 14px;
      margin-top: auto;
    }

    .footer a {
      color: #8899ff;
      text-decoration: underline;
    }
  </style>
</head>

<body id="topo">

  <!-- Menu Superior / Navbar Padrão -->
  <nav class="navbar">
    <div class="logo">⚙️ INFO TI</div>
    <ul>
      <li><a href="{% url 'index' %}">Início</a></li>
      <li><a href="{% url 'ramais' %}">Ramais</a></li>
      <li><a href="{% url 'login_ti' %}" class="active">Painel de TI</a></li>
    </ul>
    <div class="user-info">
      Status: <span>Online</span>
    </div>
  </nav>

  <div class="wireframe-container">

    <!-- Header Navigation Alternativo / Voltar -->
    <div class="card-header">
      <div>
        <strong style="font-size: 16px;">TI & Patrimônio</strong>
      </div>
      <div class="header-right">
        <a href="{% url 'painel_ti' %}" class="btn">Voltar ao Painel</a>
      </div>
    </div>

    <!-- Bloco de Edição -->
    <div class="card-bloco">
      <div class="card-title">
        Editar Equipamento: PAT-{{ equipamento.tombo }}
      </div>

      <!-- Exibição de Erro caso o Tombo já exista -->
      {% if erro %}
        <div class="alert-error">
          ⚠️ [ERRO]: {{ erro }}
        </div>
      {% endif %}

      <form method="POST" class="form-grid">
        <!-- TOKEN CSRF OBRIGATÓRIO PARA EVITAR O ERRO 403 -->
        {% csrf_token %}

        <!-- Campos Ocultos para preservar IP e Setor no banco de dados -->
        <input type="hidden" name="ip_alocado" value="{{ equipamento.ip_alocado }}">
        <input type="hidden" name="setor" value="{{ equipamento.setor }}">

        <!-- Tombo -->
        <div class="form-group">
          <label for="input-tombo">Tombo:</label>
          <div class="input-group">
            <span class="input-prefix">PAT-</span>
            <input id="input-tombo" name="tombo" maxlength="6" value="{{ equipamento.tombo }}" type="text" required>
          </div>
        </div>

        <!-- Nome da Máquina -->
        <div class="form-group">
          <label for="input-nome-maquina">Nome da Máquina:</label>
          <input id="input-nome-maquina" name="nome_maquina" value="{{ equipamento.nome_maquina }}" type="text" required>
        </div>

        <!-- Botões de Ação -->
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
          <a href="{% url 'painel_ti' %}" class="btn" style="background-color: #fff;">Cancelar</a>
          <button type="submit">Salvar Alterações</button>
        </div>
      </form>
    </div>

  </div>

  <!-- Rodapé Padrão -->
  <footer class="footer">
    INFO TI © 2026 - Sistema Interno de Suporte e Consulta | <a href="{% url 'painel_ti' %}">Voltar ao topo</a>
  </footer>

</body>

</html>
