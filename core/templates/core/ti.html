<!DOCTYPE html>
<html lang="pt-BR" class="h-full">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login TI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            color: #000000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wireframe-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Título Principal acima dos cartões */
        .titulo-pagina {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            margin-bottom: 5px;
        }

        /* Barra de Voltar */
        .card-topo {
            border: 2px dashed #333;
            background-color: #ffffff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-voltar {
            text-decoration: none;
            color: #000;
            font-size: 13px;
            font-weight: bold;
            background-color: #e0e0e0;
            padding: 5px 10px;
            border: 1px solid #999;
        }

        .btn-voltar:hover {
            background-color: #d0d0d0;
        }

        .badge-protegido {
            font-size: 11px;
            font-weight: bold;
            border: 1px solid #333;
            padding: 2px 6px;
            background-color: #fff;
        }

        /* Cartão Principal do Login */
        .card-login {
            border: 2px dashed #333;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .card-login-header {
            background-color: #f0f0f0;
            padding: 12px 20px;
            border-bottom: 2px dashed #333;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Formulário */
        form {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            padding: 8px;
            border: 1px solid #999;
            background-color: #e8f0fe;
            font-size: 14px;
            width: 100%;
        }

        .helper-text {
            font-size: 11px;
            color: #666;
        }

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #0000ee;
            text-decoration: underline;
            font-size: 11px;
            cursor: pointer;
            padding: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        /* Botão de Submissão */
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            background-color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        button[type="submit"]:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>

<body>

    <!-- Content Container -->
    <main class="wireframe-container">
        
        <!-- Título Posicionado no local solicitado -->
        <h1 class="titulo-pagina">INFO TI - Gestão Integrada</h1>

        <!-- Top Bar com Botão Voltar -->
        <div class="card-topo">
            <a class="btn-voltar" href="{% url 'index' %}">
                Voltar ao Início
            </a>
            <span class="badge-protegido">
                Acesso Protegido
            </span>
        </div>

        <!-- Login Card -->
        <div class="card-login">
            <div class="card-login-header">
                AUTENTICAÇÃO AREA RESTRITA TI
            </div>

            <!-- Formulário do Django -->
            <form method="POST" action="">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">
                        Usuário:
                    </label>
                    <input id="username" name="username" placeholder="ex: joao.silva" required type="text">
                    <span class="helper-text">Formato:(Ex: joao.silva)</span>
                </div>

                <div class="form-group">
                    <div class="password-header">
                        <label for="password">
                            Senha:
                        </label>
                        <button class="toggle-btn" id="togglePass" onclick="
                            const p = document.getElementById('password');
                            const isPass = p.type === 'password';
                            p.type = isPass ? 'text' : 'password';
                            this.innerText = isPass ? 'Ocultar' : 'Mostrar';
                        " type="button">
                            Mostrar
                        </button>
                    </div>
                    <input id="password" name="password" placeholder="••••••••" required type="password">
                </div>

                <div class="checkbox-group">
                    <input id="rememberDevice" type="checkbox">
                    <label for="rememberDevice" style="font-weight: normal; cursor: pointer;">
                        Lembrar credencial neste terminal da fábrica
                    </label>
                </div>

                <div>
                    <button type="submit">
                        ENTRAR NO PAINEL TI
                    </button>
                </div>
            </form>
        </div>

    </main>

</body>

</html>
