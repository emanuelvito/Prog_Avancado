<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Tela Inicial</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Centraliza o conteúdo perfeitamente no meio da página */
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .grid-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: stretch;
      max-width: 700px;
      width: 100%;
    }

    .card-componente {
      border: 2px dashed #333;
      padding: 20px;
      flex: 1;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-componente h3 {
      margin-bottom: 5px;
    }

    .card-componente p {
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .lista-especificacoes {
      margin: 15px 0 20px 20px;
      font-size: 14px;
    }

    .lista-especificacoes li {
      margin-bottom: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      background-color: #e0e0e0;
      border: 1px solid #999;
      margin-top: auto;
    }

    /* Ajuste para ecrãs pequenos */
    @media (max-width: 600px) {
      .grid-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <h2>INFO TI</h2>

  <div class="grid-container">
    
    <!-- Componente 1: Consulta de Ramais -->
    <div class="card-componente">
      <div>
        <h3>Consulta de Ramais <small>(Público)</small></h3>
        <p>Catálogo Interno</p>
        
        <strong>Especificações:</strong>
        <ul class="lista-especificacoes">
          <li>Acesso público imediato</li>
          <li>Lista atualizada da fábrica</li>
        </ul>
      </div>

      <a href="{% url 'ramais' %}" class="btn-link">
        <button type="button">Acessar Ramais</button>
      </a>
    </div>

    <!-- Componente 2: Área Restrita TI -->
    <div class="card-componente">
      <div>
        <h3>Área Restrita TI <small>(Restrito)</small></h3>
        <p>Painel Administrativo</p>
        
        <strong>Especificações:</strong>
        <ul class="lista-especificacoes">
          <li>Gestão de Patrimónios</li>
          <li>Controle de IPs</li>
        </ul>
      </div>

      <a href="{% url 'login_ti' %}" class="btn-link">
        <button type="button">Login TI</button>
      </a>
    </div>

  </div>

</body>
</html>
